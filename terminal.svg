    <!-- Active Prompt & Sync Timestamp -->
    <g class="line l8">
      <text class="prompt" x="24" y="334">❯</text>
      <rect class="cursor" x="42" y="334" width="9" height="16" transform="translate(0 -13)" />
      <text class="muted" x="796" y="334" text-anchor="end">synced 2026-11-24 18:04 UTC</text>
    </g>
  </g>
</svg>
