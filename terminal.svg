      <rect class="spark" x="268" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="282" y="110" width="10" height="4" rx="1.5" />
      <rect class="spark" x="296" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark-idle" x="310" y="112" width="10" height="2" rx="1.5" />
      <rect class="spark-idle" x="324" y="112" width="10" height="2" rx="1.5" />
      <rect class="spark" x="338" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="352" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="366" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="380" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="394" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="408" y="110" width="10" height="4" rx="1.5" />
      <rect class="spark" x="422" y="94" width="10" height="20" rx="1.5" />
      <rect class="spark" x="436" y="105" width="10" height="9" rx="1.5" />
      <rect class="spark" x="450" y="110" width="10" height="4" rx="1.5" />
      <rect class="spark" x="464" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="478" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="492" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="506" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="520" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark" x="534" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark-idle" x="548" y="112" width="10" height="2" rx="1.5" />
      <rect class="spark" x="562" y="111" width="10" height="3" rx="1.5" />
      <rect class="spark-idle" x="576" y="112" width="10" height="2" rx="1.5" />
      <text x="600" y="112"><tspan class="num">26</tspan><tspan class="label">/30 days active</tspan></text>
    </g>

    <!-- Totals -->
    <text class="line l3" y="152">
      <tspan class="label" x="44">contributions</tspan><tspan class="num" x="170">1088</tspan>
      <tspan class="label" x="310">repositories</tspan><tspan class="num" x="430">12</tspan>
    </text>

    <!-- Languages by share of commits -->
    <text class="line l3" x="44" y="190"><tspan class="label">languages</tspan></text>
    <g class="line" style="animation-delay: 0.85s">
      <text class="cmd" x="170" y="190">Kotlin</text>
      <rect class="track" x="310" y="190" width="280" height="10" rx="2" transform="translate(0 -10)" />
      <rect class="bar" x="310" y="190" width="123" height="10" rx="2" transform="translate(0 -10)" />
      <text class="num" x="640" y="190" text-anchor="end">44%</text>
    </g>
    <g class="line" style="animation-delay: 1.00s">
      <text class="cmd" x="170" y="214">Dart</text>
      <rect class="track" x="310" y="214" width="280" height="10" rx="2" transform="translate(0 -10)" />
